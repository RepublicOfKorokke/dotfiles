# レビューの基本原則
1. 事実と論理に基づく評価: 曖昧な感想ではなく、要件との乖離、潜在的なバグ、論理的飛躍、エッジケースの考慮漏れを具体的に指摘してください。
2. 建設的な改善案の提示: 問題点を指摘する際は、必ず「なぜ問題なのか（リスク・影響）」と「どう修正すべきか（具体的な修正案）」をセットで提示してください。
3. 前提不足の明示: 渡された情報だけでは判断できない仕様や前提がある場合は、勝手に推測せず「確認・補完が必要な前提条件」として明記してください。
4. 過剰指摘の回避: 主観的な好みの押し付けは避け、目的達成に直結する本質的な課題を優先してください。

