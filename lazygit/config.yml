git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
  autoFetch: false
  branchLogCmd: git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)%ad%Creset %C(#dd4814)%ae%Creset %C(yellow reverse)%d%Creset %n%C(white bold)%s%Creset%n' {{branchName}} --
  allBranchesLogCmds:
    - git log --graph --color=always --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%C(#a0a0a0 reverse)%h%Creset %C(cyan)%ad%Creset %C(#dd4814)%ae%Creset %C(yellow reverse)%d%Creset %n%C(white bold)%s%Creset%n' --
gui:
  mouseEvents: false
  nerdFontsVersion: "3"
customCommands:
  - key: 'G' # Or any unused keybinding you prefer
    context: 'files'
    description: 'Open selected file in leaf'
    command: 'leaf {{.SelectedFile.Name}}'
    output: terminal
  - key: 'G'
    context: 'commitFiles'
    description: 'Open selected commit file in Glow'
    command: 'leaf {{.SelectedCommitFile.Name}}'
    output: terminal
